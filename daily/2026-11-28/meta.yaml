  title: 金管會：金融業年底前完成 14 項資安自評
  summary: 金管會 2026-11-26 發布「金融業資安防護強化措施」：金融機構要在 115 年底前完成 14 項自評並提報董事會。內容涵蓋漏洞修補動態排序、停止支援系統的汰換、金鑰與憑證管理。金融業客戶會問各項拿什麼當佐證。
