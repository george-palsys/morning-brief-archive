# 晨報產品追蹤清單(26 項)
#
# 用途:GeorgeAI 每天產生晨報的「產品動態」段落時,照這份清單逐一檢查每個產品的
#       release note、安全公告、生命週期公告。規則見 SPEC.md。
#
# 清單來源:2026-11-03 Business Plan 產品分工表的 25 項,加上後來加入的 CMC。
#           第 26 項為 IBM CMC(George 於 2026-11-19 確認)。
#
# status 欄位的意思(每個網址各自標示):
#   searched   = 這個網址出現在 2026-11-19 的網路搜尋結果中,但沒有逐頁打開核對內容
#   repo_checked = 2026-11-19 用 git 確認過該 GitHub 專案存在;releases 與 advisories 頁是 GitHub 的固定路徑,頁面本身未打開
#   unverified = 憑既有知識填寫,2026-11-19 沒有在搜尋結果中看到,第一次使用前要先確認
#   none       = 沒有查到公開來源
#
# version_specific: true 表示網址裡帶版本號,產品出新的主要版本時要更新網址。

version: 1
updated: 2026-11-19

shared_sources:
  - name: IBM Security Bulletins 入口(PSIRT)
    url: https://www.ibm.com/trust/security-psirt
    status: searched
    applies_to: 所有 IBM 產品
  - name: IBM Security Vulnerability Management
    url: https://www.ibm.com/support/pages/ibm-security-vulnerability-management
    status: searched
    applies_to: 所有 IBM 產品
  - name: Red Hat Product Errata(RHSA / RHBA / RHEA)
    url: https://access.redhat.com/errata/
    status: searched
    applies_to: 所有 Red Hat 產品
    note: 搜尋結果看到的是個別 errata 頁(例如 /errata/RHSA-2026:27200),清單首頁本身未核對
  - name: Red Hat Security Bulletins(RHSB)
    url: https://access.redhat.com/security/vulnerabilities/
    status: unverified
    applies_to: 所有 Red Hat 產品
    note: 2026-11-19 晨報引用過 /security/vulnerabilities/RHSB-2026-018,清單頁網址為推定
  - name: SUSE Rancher Security
    url: https://www.suse.com/support/security/rancher-security/
    status: searched
    applies_to: Rancher、RKE2、NeuVector
  - name: CISA Known Exploited Vulnerabilities
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    status: unverified
    applies_to: 全部產品(交叉比對是否已遭利用)

