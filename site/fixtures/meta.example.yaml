# v4 顯示欄位範例；其他既有欄位沿用日報 meta.yaml。
# attention 與 display 必填；五個段落清單必填，空清單顯示「今天沒有」。
# section 必填列舉；title／summary 必填字串，寬度上限 40／200，缺值建置失敗。
# facts 選填 0–4 筆，缺值只顯示警示文字。label／value 必填；
# source 選填，同一件事有不同來源的值時必填。
# short／keyword 必填，寬度上限 24／8 半形字元，缺值無替代顯示。
# date 選填 YYYY-MM-DD，缺值不顯示。
# figures 選填 0–3 筆，label／value 必填；缺值隱藏數字區。
# digest 選填，長度上限待定；缺值顯示 Markdown 完整標題。
# caveat 各段共用，選填無上限；缺值不顯示注意區塊。
# ai_summary 選填，寬度上限 60；缺值只顯示「今天 N 則。」。
# cve_ids／cvss 必填清單，沒有就填 []；無分數顯示「未提供」。
# cvss 每筆需 score、version、source；未知版本填 null。
# exploited／patch／related／kind 在適用段落必填；unknown 顯示對應的未寫明文案。
# exploited_detail／patch_detail 選填無上限；缺值用 SPEC 固定文案。
# kev 選填，包含 cve_id、product、due（YYYY-MM-DD）；缺值不顯示。
# drill 選填布林，長度不適用；沒填等同 false，不顯示免責聲明。
